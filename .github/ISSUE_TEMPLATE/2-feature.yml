name: Feature request
description: Suggest something NoMercy should do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: clients
    attributes:
      label: Where should it work?
      description: A feature ships to every client where it makes sense. Tick all that apply.
      options:
        - label: Media server
        - label: Web app
        - label: Android phone and tablet
        - label: Android TV
        - label: Chromecast
        - label: nomercy.tv website

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, links, or how another app does it.
