name: Reusable — Cleanup old workflow runs

on:
  workflow_call:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Test the retention policy
        working-directory: .github/scripts
        run: python3 -m unittest test_cleanup_policy -v

      - name: Delete old workflow runs across org
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          ORG: NoMercy-Entertainment
        run: |
          set -euo pipefail
          source .github/scripts/cleanup_policy.sh

          now=$(date +%s)

          echo "=== Cleanup Policy ==="
          echo "Cancelled: delete after ${CANCELLED_MAX_AGE_DAYS} day(s)"
          echo "Failed:    delete after ${FAILED_MAX_AGE_DAYS} day(s)"
          echo "Success:   keep the newest ${KEEP_SUCCESSFUL} per workflow; delete the others after ${SUCCESS_MAX_AGE_DAYS} day(s)"
          echo "Skipped:   ${SKIP_REPOS}"
          echo ""

          repos=$(gh api --paginate "orgs/${ORG}/repos" --jq '.[].full_name')
          total_deleted=0

          for repo in $repos; do
            skip_repo "$repo" && continue
            workflows=$(gh api "repos/${repo}/actions/workflows" --jq '.workflows[].id' 2>/dev/null || true)
            [ -z "$workflows" ] && continue

            repo_deleted=0

            for workflow_id in $workflows; do
              runs=$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[] | [.id, .conclusion // "null", .created_at, .status] | @tsv' 2>/dev/null || true)
              [ -z "$runs" ] && continue

              successful_count=0

              while IFS=$'\t' read -r run_id conclusion created_at status; do
                case "$status" in
                  in_progress|queued|waiting) continue ;;
                esac

                created_ts=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
                age_days=$(( (now - created_ts) / 86400 ))
                [ "$conclusion" = success ] && successful_count=$((successful_count + 1))

                if should_delete "$conclusion" "$age_days" "$successful_count"; then
                  gh api -X DELETE "repos/${repo}/actions/runs/${run_id}" 2>/dev/null && {
                    repo_deleted=$((repo_deleted + 1))
                  } || true
                fi
              done <<< "$runs"
            done

            if [ "$repo_deleted" -gt 0 ]; then
              echo "${repo}: deleted ${repo_deleted} run(s)"
              total_deleted=$((total_deleted + repo_deleted))
            fi
          done

          echo ""
          echo "=== Deleted ${total_deleted} workflow run(s) across org ==="
