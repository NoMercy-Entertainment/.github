name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs across org
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          ORG: NoMercy-Entertainment
        run: |
          set -euo pipefail

          # Policy
          CANCELLED_MAX_AGE_DAYS=1
          FAILED_MAX_AGE_DAYS=7
          KEEP_SUCCESSFUL=1  # per workflow

          now=$(date +%s)

          echo "=== Cleanup Policy ==="
          echo "Cancelled: delete after ${CANCELLED_MAX_AGE_DAYS} day(s)"
          echo "Failed:    delete after ${FAILED_MAX_AGE_DAYS} day(s)"
          echo "Success:   keep ${KEEP_SUCCESSFUL} per workflow"
          echo ""

          # Get all repos in the org
          repos=$(gh api --paginate "orgs/${ORG}/repos" --jq '.[].full_name')

          total_deleted=0

          for repo in $repos; do
            # Get workflows for this repo
            workflows=$(gh api "repos/${repo}/actions/workflows" --jq '.workflows[].id' 2>/dev/null || true)

            if [ -z "$workflows" ]; then
              continue
            fi

            repo_deleted=0

            for workflow_id in $workflows; do
              # Get all runs for this workflow (up to 100 most recent)
              runs=$(gh api "repos/${repo}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[] | [.id, .conclusion // "null", .created_at, .status] | @tsv' 2>/dev/null || true)

              if [ -z "$runs" ]; then
                continue
              fi

              successful_count=0

              while IFS=$'\t' read -r run_id conclusion created_at status; do
                # Skip in-progress runs
                if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "waiting" ]; then
                  continue
                fi

                created_ts=$(date -d "$created_at" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$created_at" +%s 2>/dev/null || echo 0)
                age_days=$(( (now - created_ts) / 86400 ))

                should_delete=false

                case "$conclusion" in
                  cancelled|skipped)
                    if [ "$age_days" -ge "$CANCELLED_MAX_AGE_DAYS" ]; then
                      should_delete=true
                    fi
                    ;;
                  failure|timed_out|startup_failure)
                    if [ "$age_days" -ge "$FAILED_MAX_AGE_DAYS" ]; then
                      should_delete=true
                    fi
                    ;;
                  success)
                    successful_count=$((successful_count + 1))
                    if [ "$successful_count" -gt "$KEEP_SUCCESSFUL" ]; then
                      should_delete=true
                    fi
                    ;;
                  *)
                    # action_required, stale, null — treat as cancelled
                    if [ "$age_days" -ge "$CANCELLED_MAX_AGE_DAYS" ]; then
                      should_delete=true
                    fi
                    ;;
                esac

                if [ "$should_delete" = true ]; then
                  gh api -X DELETE "repos/${repo}/actions/runs/${run_id}" 2>/dev/null && {
                    repo_deleted=$((repo_deleted + 1))
                  } || true
                fi
              done <<< "$runs"
            done

            if [ "$repo_deleted" -gt 0 ]; then
              echo "${repo}: deleted ${repo_deleted} run(s)"
              total_deleted=$((total_deleted + repo_deleted))
            fi
          done

          echo ""
          echo "=== Done: deleted ${total_deleted} workflow run(s) across org ==="
