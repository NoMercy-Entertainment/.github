name: Reusable — Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "22"
      build_command:
        description: "Build command to run (e.g. 'yarn build' or 'npm run build')"
        required: false
        type: string
        default: "yarn build"
      output_dir:
        description: "Directory containing the built files to deploy"
        required: false
        type: string
        default: "dist"
      cname:
        description: "Custom domain for GitHub Pages (leave empty for no CNAME)"
        required: false
        type: string
        default: ""
      install_command:
        description: "Install command to run (e.g. 'yarn install' or 'npm install')"
        required: false
        type: string
        default: "yarn install"
      enable_corepack:
        description: "Enable corepack before install (needed for Yarn Berry)"
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        if: inputs.enable_corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: ${{ inputs.install_command }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ github.token }}
          publish_dir: ./${{ inputs.output_dir }}
          cname: ${{ inputs.cname || '' }}
